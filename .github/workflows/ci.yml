name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run benchmark tests
        run: python -m pytest benchmarks/context_efficiency_v0/tests/ -q

      - name: Compile check
        run: python -m compileall -q thinkos/ benchmarks/context_efficiency_v0/
